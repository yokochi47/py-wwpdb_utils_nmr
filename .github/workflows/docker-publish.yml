name: Docker

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

on:
  schedule:
    - cron: '0 3 * * 3'
  push:
    branches: [ "main" ]
    # Publish semver tags as releases.
    tags: [ 'v*.*.*' ]

env:
  # Use docker.io for Docker Hub if empty
  REGISTRY: ghcr.io
  # github.repository as <account>/<repo>
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # This is used to complete the identity challenge
      # with sigstore/fulcio when running outside of PRs.
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # Install the cosign tool except on PR
      # https://github.com/sigstore/cosign-installer
      - name: Install cosign
        if: github.event_name != 'pull_request'
        uses: sigstore/cosign-installer@v4.1.0

      # Set up BuildKit Docker container builder to be able to build
      # multi-platform images and export cache
      # https://github.com/docker/setup-buildx-action
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.2.0

      # Login against a Docker registry except on PR
      # Use a personal access token (CR_PAT) if provided, otherwise GITHUB_TOKEN.
      # https://github.com/docker/login-action
      - name: Log into registry ${{ env.REGISTRY }}
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.CR_PAT || secrets.GITHUB_TOKEN }}

      # Extract metadata (tags, labels) for Docker
      # https://github.com/docker/metadata-action
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

      # Build and push Docker image with Buildx (don't push on PR)
      # https://github.com/docker/build-push-action
      - name: Build and push Docker image
        id: build-and-push
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: ${{ github.event_name != 'schedule' && 'type=gha' || '' }}
          cache-to: ${{ github.event_name != 'schedule' && 'type=gha,mode=max' || '' }}

      # Sign the resulting Docker image digest except on PRs.
      - name: Sign the published Docker image
        if: ${{ github.event_name != 'pull_request' }}
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.build-and-push.outputs.digest }}
        # This step uses the identity token to provision an ephemeral certificate
        # against the sigstore community Fulcio instance.
        run: echo "${TAGS}" | xargs -I {} cosign sign --yes {}@${DIGEST}

  deploy:
    needs: build
    runs-on: self-hosted
    permissions:
      contents: read
    steps:
      - name: Deployment and rolling update to self-hosted servers
        shell: bash
        run: |
          # Wait for image to be available with retry logic
          max_attempts=10
          attempt=1
          while [ $attempt -le $max_attempts ]; do
            if docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }}; then
              echo "Image pull successful"
              break
            fi
            echo "Attempt $attempt failed, retrying in 10 seconds..."
            sleep 10
            ((attempt++))
          done

          if [ $attempt -gt $max_attempts ]; then
            echo "Failed to pull image after $max_attempts attempts"
            exit 1
          fi

          docker system info | grep Swarm | grep active > /dev/null || docker swarm init
          docker service ps ${{ github.event.repository.name }} > /dev/null \
            && ((docker service update --force -q --restart-condition on-failure --restart-max-attempts 3 --update-failure-action continue --image ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }} ${{ github.event.repository.name }} \
                || true) &) \
            || (docker service create -q --replicas 3 --name ${{ github.event.repository.name }} --update-delay 20s --restart-condition on-failure --restart-max-attempts 3 --update-failure-action continue ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }} &)
          sleep 60 && [[ `docker images -q -f "dangling=true" ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }} | wc -l` -gt 0 ]] \
            && docker rmi -f $(docker images -q -f "dangling=true" ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }})
